services:
  - type: web
    name: pantaukrisis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://mdaniel97.github.io,https://pantaukrisis-dashboard.malaysiaprototype.site
      - key: PYTHON_VERSION
        value: "3.11"
      - key: EIA_API_KEY
        sync: false
